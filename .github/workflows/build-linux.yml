name: Build Next.js Linux Artifact

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build app
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Prepare deploy package
        run: |
          mkdir -p deploy
          cp -r .next/standalone deploy/
          mkdir -p deploy/standalone/.next
          cp -r .next/static deploy/standalone/.next/static
          cp -r public deploy/
          cp package.json deploy/
          cp app.cjs deploy/
          if [ -f .env.production ]; then cp .env.production deploy/.env.production; fi

      - name: Create tarball
        run: |
          tar -czf propwise-linux-build.tar.gz -C deploy .

      - name: Verify package contents
        run: |
          test -f deploy/app.cjs
          test -f deploy/standalone/server.js
          test -d deploy/standalone/.next/static
          test -d deploy/public
          tar -tzf propwise-linux-build.tar.gz | grep -E '(^|/)standalone/.next/static(/|$)' >/dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: propwise-linux-build-${{ github.run_number }}
          include-hidden-files: true
          path: propwise-linux-build.tar.gz
